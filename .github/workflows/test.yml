name: test

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugin/mcp/model-dispatch/package-lock.json

      - name: Install root deps
        run: npm ci

      # test-mcp.mjs only exercises the MCP server suite when its
      # node_modules exists; install here so CI runs the full suite,
      # not the "MCP tests NOT RUN" fallback.
      - name: Install MCP server deps
        run: npm ci
        working-directory: plugin/mcp/model-dispatch

      # The root suite imports plugin/codex/telemetry/event-reader.mjs, which
      # resolves into the server's compiled dist/. `npm test` builds it, but
      # only in its second half (tools/test-mcp.mjs) — by which point the root
      # suite has already failed to resolve the module. Build it up front.
      - name: Build MCP server
        run: npm run build
        working-directory: plugin/mcp/model-dispatch

      - name: Run tests
        run: npm test
