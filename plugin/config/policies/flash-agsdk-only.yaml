# Flash-only floor — every dispatched task (judgment AND mechanical) routes to
# Gemini 3.7 Flash via the Antigravity SDK agent adapter.
#
# IMPORTANT: the conductor's OWN turns (planning, tool-calling, gate answers)
# run on the GPT model pinned in `driver:` below, inside `codex exec`, not on
# Flash. Only the dispatched `execute_with_model` calls this policy governs
# route to Flash, so a run needs ADC and a codex login, and no OPENAI_API_KEY.
# The driver turns are reported as modeled driver-loop cost in their own
# section; the report's run total adds them to the dispatched total and keeps
# them out of the vendor-metered total — see docs/methodology.md.
version: 1
name: flash-agsdk-only

# The conductor's pin: run.mjs passes -m and the effort from here to codex exec,
# and start-run.mjs starts no run in a codex session on another model or effort.
# Its modeled cost is priced from the dated price list (src/prices.ts); the
# pricing block below documents that rate, and a test holds it to the list.
# Not a models[] entry, because it is never dispatched and preflight would
# demand its credential. The same in every runnable policy, so a comparison
# between policies holds it constant.
driver:
  model_name: gpt-5.6-terra
  reasoning: { effort: high }
  pricing: { input: 2.00, input_cached: 0.20, output: 12.00 }
  pricing_source: https://platform.openai.com/docs/pricing
  pricing_last_verified: 2026-10-13

models:
  - id: flash
    adapter: antigravity-worker
    model_name: gemini-3.7-flash
    display_name: gemini-3.7-flash (Antigravity agent)
    # Introductory rate through 2026-12-31. The price list (src/prices.ts) bills
    # 1.50 / 0.15 / 7.50 from 2027-01-01; update this documentation block then.
    # Vertex adds +10% on REGIONAL endpoints; geminiTransports.ts::applyVertexSurcharge
    # applies it at dispatch — do not hand-edit x1.10 in.
    pricing: { input: 0.75, input_cached: 0.075, output: 3.75 }
    pricing_source: https://ai.google.dev/gemini-api/docs/pricing (AI Studio + Vertex global); https://cloud.google.com/vertex-ai/generative-ai/pricing (regional +10%)
    pricing_last_verified: 2026-10-12
    # `region:` unpinned so this leaf follows GOOGLE_CLOUD_LOCATION and hits
    # the flat global endpoint by default. Vertex-only: the Antigravity SDK is
    # ADC-only and has no API-key door, so no `auth:` block.
    worker_timeout_sec: 540
    # No max_output_tokens_absolute — agent sessions manage their own per-turn
    # limits.

rules:
  # Every phase → flash. Explicit rules per phase (not just a default) so
  # telemetry rollups show the routing decision was intentional per-phase.
  - when: { phase: requirements_analysis }
    use: flash
    reason: "Floor tier: judgment routed to Flash agent"
  - when: { phase: architecture_design }
    use: flash
    reason: "Floor tier: judgment routed to Flash agent"
  - when: { phase: plan_task_packets }
    use: flash
    reason: "Floor tier: judgment routed to Flash agent"
  - when: { phase: senior_code_review }
    use: flash
    reason: "Floor tier: judgment routed to Flash agent"
  - when: { phase: security_review }
    use: flash
    reason: "Floor tier: judgment routed to Flash agent"

  # Brownfield-mode phases.
  - when: { phase: discovery }
    use: flash
    reason: "Floor tier: brownfield discovery routed to Flash agent"
  - when: { phase: change_plan }
    use: flash
    reason: "Floor tier: brownfield change plan routed to Flash agent"

  # Mechanical tier.
  - when: { phase: codegen }
    use: flash
    reason: "Mechanical tier — all codegen task types"
  - when: { phase: tests }
    use: flash
    reason: "Mechanical tier"
  - when: { phase: docs }
    use: flash
    reason: "Mechanical tier"
  - when: { phase: debug }
    use: flash
    reason: "Mechanical tier — no escalation; this policy is the floor"

  - default: flash
    reason: "Single-model floor policy"

# Hard per-run cost cap. Flash is cheap per token but the AG-SDK agent can
# burn tokens on long sessions — keep the cap on.
hard_cost_cap_usd: 50
